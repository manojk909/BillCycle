services:
  db:
    image: postgres:16-alpine
    container_name: billcycle-db
    environment:
      POSTGRES_USER: billcycle
      POSTGRES_PASSWORD: billcycle
      POSTGRES_DB: billcycle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billcycle"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit:v1.21
    container_name: billcycle-mail
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  pgdata:
